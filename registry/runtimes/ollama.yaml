security_notes: >-
  Ollama serves an unauthenticated HTTP API on 127.0.0.1:11434 by default and
  has no built-in authentication or authorisation, so Section 10.3 requires it
  stay loopback-bound on workstations. It also downloads model artefacts
  automatically, which Section 10.2 requires be understood before approval.
  Track advisories against github.com/ollama/ollama.
documentation:
