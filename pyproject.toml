[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lomst"
version = "0.1.0"
description = "Local & Open-Source Model Security Tracker - daily ingest, governance classification and MCP server for the Paradox Interactive AI Governance Framework"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lomst = "lomst.cli:main"
lomst-mcp = "lomst.mcp_server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
